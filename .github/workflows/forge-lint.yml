name: Forge Lint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-lint:
    name: Forge Lint
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: 0xJem/forge-lint-inline-action@2558c3a619002cd5857e73d750954f5e2248ee07
        with:
          foundry-version: stable
          args: "--only-lint mixed-case-function"
          fail-level: none
