name: Forge Lint

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  checks: read
  contents: read

jobs:
  forge-lint:
    name: Forge Lint (${{ matrix.foundry-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        foundry-version:
          - v1.5.1
          - v1.7.0
          - stable
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: 0xJem/forge-lint-inline-action@2558c3a619002cd5857e73d750954f5e2248ee07
        with:
          foundry-version: ${{ matrix.foundry-version }}
          fail-level: none

      - name: Require annotations
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: Forge Lint (${{ matrix.foundry-version }})
        run: |
          set -euo pipefail

          check_run_id="$(
            gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq ".check_runs[] | select(.name == env.JOB_NAME) | .id" \
              | head -n 1
          )"

          if [ -z "$check_run_id" ]; then
            echo "::error::Could not find check run for ${JOB_NAME}"
            exit 1
          fi

          annotation_count="$(
            gh api "/repos/${GITHUB_REPOSITORY}/check-runs/${check_run_id}/annotations" \
              --jq "length"
          )"

          if [ "$annotation_count" -eq 0 ]; then
            echo "::error::Expected at least one Forge lint annotation for ${JOB_NAME}"
            exit 1
          fi

          echo "Found ${annotation_count} Forge lint annotation(s) for ${JOB_NAME}"
